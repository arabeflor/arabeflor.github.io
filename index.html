      :root {
        --bg-color: #0d1117;
        --card-bg: #161b22;
        --border-color: #30363d;

        --text-muted: #8b949e;
        --accent-color: #58a6ff;
        --accent-hover: #79c0ff;

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

        color: var(--text-main);

        padding: 20px;

      .container {

        padding: 32px;

        width: 100%;

      h1 {
        font-size: 1.5rem;
        color: #ffffff;
        margin-bottom: 8px;
        font-weight: 600;
      }

      p {
        color: var(--text-muted);
        font-size: 0.95rem;
        margin-bottom: 24px;
        line-height: 1.4;
      }

      ul {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      li a {
        display: block;
        padding: 12px 16px;
        background-color: #21262d;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        color: var(--accent-color);
        text-decoration: none;
        font-weight: 500;
        font-size: 0.95rem;
        transition: all 0.2s ease-in-out;
      }

      li a:hover {
        background-color: #30363d;
        border-color: var(--accent-color);
        color: var(--accent-hover);
        transform: translateY(-2px);
      }
